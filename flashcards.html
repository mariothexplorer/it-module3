<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Флашкарти за упражнение</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .flashcard-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            max-width: 500px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            font-size: 1.25rem;
            font-weight: 500;
        }

        .card-front {
            background: linear-gradient(135deg, #333, #000);
            color: white;
        }

        .card-back {
            background: white;
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #000;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .btn:hover:not(:disabled) {
            background-color: #000;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #progress {
            font-weight: bold;
            color: #555;
        }

        #topic-title {
            margin-bottom: 20px;
            color: #333;
        }

        .hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
        }
    </style>
</head>

<body>
    <header></header>
    <nav id="site-nav" aria-label="Основно меню"></nav>

    <div class="container">
        <h2 id="topic-title">Флашкарти</h2>

        <div id="flashcard-container" class="flashcard-wrapper">
            <div class="flashcard">
                <div class="card-face card-front" id="question">
                    Въпрос...
                </div>
                <div class="card-face card-back" id="answer">
                    Отговор...
                </div>
            </div>

            <p class="hint">Кликнете върху картата, за да я обърнете</p>

            <div class="controls">
                <button id="prev-btn" class="btn">Предишна</button>
                <span id="progress">Карта 1 от X</span>
                <button id="next-btn" class="btn">Следваща</button>
            </div>
        </div>
    </div>

    <footer></footer>

    <script src="scripts/insert-header.js"></script>
    <script src="scripts/insert-menu.js"></script>
    <script src="scripts/menu.js"></script>
    <script src="scripts/insert-footer.js"></script>
    <script src="scripts/flashcards-data.js"></script>
    <script src="scripts/flashcards-logic.js"></script>
</body>

</html>
